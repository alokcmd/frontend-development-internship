<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Portal Website</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
            color: #333;
        }

        header {
            background: #172554;
            color: white;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h2 {
            color: #fff;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        .hero {
            background: #2563eb;
            color: white;
            text-align: center;
            padding: 60px 20px;
        }

        .hero h1 {
            font-size: 36px;
            margin-bottom: 15px;
        }

        .search-box {
            margin-top: 25px;
        }

        .search-box input {
            padding: 13px;
            width: 250px;
            border: none;
            border-radius: 5px;
            margin: 5px;
        }

        button {
            padding: 12px 20px;
            background: #16a34a;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #15803d;
        }

        .container {
            width: 85%;
            margin: 40px auto;
        }

        .container h2 {
            margin-bottom: 20px;
        }

        .jobs {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .job-card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 10px #ddd;
        }

        .job-card h3 {
            color: #1d4ed8;
            margin-bottom: 12px;
        }

        .job-card p {
            margin: 10px 0;
        }

        .job-card button {
            margin-top: 12px;
        }

        .admin, .application {
            background: white;
            padding: 25px;
            border-radius: 10px;
            margin-top: 40px;
            box-shadow: 0 2px 10px #ddd;
        }

        .admin input, .application input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .application {
            display: none;
        }

        footer {
            background: #172554;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 50px;
        }

        @media(max-width: 600px) {
            header {
                flex-direction: column;
                gap: 15px;
            }

            nav a {
                margin: 5px;
            }

            .hero h1 {
                font-size: 27px;
            }

            .search-box input {
                width: 90%;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <header>
        <h2>JobFinder</h2>

        <nav>
            <a href="#home">Home</a>
            <a href="#jobs">Jobs</a>
            <a href="#admin">Admin</a>
        </nav>
    </header>

    <!-- HERO SECTION -->
    <section class="hero" id="home">
        <h1>Find Your Dream Job</h1>
        <p>Search thousands of jobs and start your career today.</p>

        <div class="search-box">
            <input type="text" id="searchInput"
                   placeholder="Search job title...">

            <button onclick="searchJobs()">Search</button>
        </div>
    </section>

    <!-- JOB LIST -->
    <section class="container" id="jobs">
        <h2>Available Jobs</h2>
        <div class="jobs" id="jobList"></div>
    </section>

    <!-- APPLICATION FORM -->
    <section class="container application" id="application">
        <h2>Apply for Job</h2>

        <form id="applicationForm">
            <input type="text" id="applicantName"
                   placeholder="Your Name" required>

            <input type="email" id="applicantEmail"
                   placeholder="Your Email" required>

            <input type="text" id="applicantPhone"
                   placeholder="Your Phone Number" required>

            <input type="text" id="applicantResume"
                   placeholder="Resume Link (Optional)">

            <button type="submit">Submit Application</button>
            <button type="button" onclick="closeApplication()">
                Cancel
            </button>
        </form>
    </section>

    <!-- ADMIN SECTION -->
    <section class="container admin" id="admin">
        <h2>Admin - Add New Job</h2>

        <form id="jobForm">
            <input type="text" id="jobTitle"
                   placeholder="Job Title" required>

            <input type="text" id="company"
                   placeholder="Company Name" required>

            <input type="text" id="location"
                   placeholder="Job Location" required>

            <input type="text" id="salary"
                   placeholder="Salary" required>

            <button type="submit">Add Job</button>
        </form>
    </section>

    <!-- FOOTER -->
    <footer>
        <p>© 2026 JobFinder | All Rights Reserved</p>
    </footer>

    <script>
        // JOB DATA
        let jobs = [
            {
                id: 1,
                title: "Frontend Developer",
                company: "Google",
                location: "Bangalore",
                salary: "6 LPA"
            },
            {
                id: 2,
                title: "Python Developer",
                company: "Infosys",
                location: "Pune",
                salary: "5 LPA"
            },
            {
                id: 3,
                title: "Full Stack Developer",
                company: "TCS",
                location: "Noida",
                salary: "7 LPA"
            }
        ];

        let selectedJob = "";

        // DISPLAY JOBS
        function displayJobs(jobData) {
            const jobList = document.getElementById("jobList");

            jobList.innerHTML = "";

            if (jobData.length === 0) {
                jobList.innerHTML = "<p>No jobs found.</p>";
                return;
            }

            jobData.forEach(function(job) {
                jobList.innerHTML += `
                    <div class="job-card">
                        <h3>${job.title}</h3>
                        <p><b>Company:</b> ${job.company}</p>
                        <p><b>Location:</b> ${job.location}</p>
                        <p><b>Salary:</b> ${job.salary}</p>

                        <button onclick="applyJob(${job.id})">
                            Apply Now
                        </button>

                        <button onclick="deleteJob(${job.id})"
                                style="background:#dc2626">
                            Delete
                        </button>
                    </div>
                `;
            });
        }

        // SEARCH JOBS
        function searchJobs() {
            let search = document.getElementById("searchInput")
                .value.toLowerCase();

            let filteredJobs = jobs.filter(function(job) {
                return (
                    job.title.toLowerCase().includes(search) ||
                    job.company.toLowerCase().includes(search) ||
                    job.location.toLowerCase().includes(search)
                );
            });

            displayJobs(filteredJobs);
        }

        // APPLY FOR JOB
        function applyJob(jobId) {
            selectedJob = jobs.find(function(job) {
                return job.id === jobId;
            });

            if (!selectedJob) return;

            document.getElementById("application").style.display = "block";

            document.getElementById("application")
                .scrollIntoView({ behavior: "smooth" });
        }

        function closeApplication() {
            document.getElementById("application").style.display = "none";
        }

        // SUBMIT APPLICATION
        document.getElementById("applicationForm")
            .addEventListener("submit", function(event) {

            event.preventDefault();

            let name = document.getElementById("applicantName").value;
            let email = document.getElementById("applicantEmail").value;
            let phone = document.getElementById("applicantPhone").value;
            let resume = document.getElementById("applicantResume").value;

            let application = {
                job: selectedJob.title,
                name: name,
                email: email,
                phone: phone,
                resume: resume
            };

            console.log("Application:", application);

            alert("Application submitted successfully!");

            this.reset();
            closeApplication();
        });

        // ADD NEW JOB
        document.getElementById("jobForm")
            .addEventListener("submit", function(event) {

            event.preventDefault();

            let newJob = {
                id: Date.now(),
                title: document.getElementById("jobTitle").value,
                company: document.getElementById("company").value,
                location: document.getElementById("location").value,
                salary: document.getElementById("salary").value
            };

            jobs.push(newJob);

            displayJobs(jobs);

            alert("New job added successfully!");

            this.reset();
        });

        // DELETE JOB
        function deleteJob(jobId) {
            if (confirm("Are you sure you want to delete this job?")) {
                jobs = jobs.filter(function(job) {
                    return job.id !== jobId;
                });

                displayJobs(jobs);
            }
        }

        // INITIAL DISPLAY
        displayJobs(jobs);
    </script>

</body>
</html>
